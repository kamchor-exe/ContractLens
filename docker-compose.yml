version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractlens
      POSTGRES_PASSWORD: contractlens
      POSTGRES_DB: contractlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
